# MediaCBD — Nginx
# Frontend: /home/mediacbd.fr/public_html
# Django:   Gunicorn 127.0.0.1:8002
#
# Prefer pasting deploy/nginx/locations.conf into the EXISTING
# mediacbd.fr server { } (SSL already works). Use this full file
# only if you replace the site vhost.
#
# After edit: nginx -t && systemctl reload nginx

upstream mediacbd_django {
    server 127.0.0.1:8002 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mediacbd.fr www.mediacbd.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /home/mediacbd.fr/public_html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mediacbd.fr www.mediacbd.fr;

    root /home/mediacbd.fr/public_html;
    index index.html;

    # Virtualmin default. Switch to Let's Encrypt paths if those are the live certs:
    # ssl_certificate     /etc/letsencrypt/live/mediacbd.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mediacbd.fr/privkey.pem;
    ssl_certificate     /home/mediacbd.fr/ssl.combined;
    ssl_certificate_key /home/mediacbd.fr/ssl.key;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://mediacbd_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /admin/ {
        proxy_pass http://mediacbd_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
