# MediaCBD — Nginx
# React `react/dist` is the public site. Django (Gunicorn) only serves /api/ and /admin/.
#
# Webmin / host admin: proxy /api/ /admin/ /static/ to 127.0.0.1:8001
# (Gunicorn is started by the project user via backend/gunicorn-ctl.sh).

upstream mediacbd_django {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mediacbd.fr www.mediacbd.fr;

    # SPA files. If you already copied dist into Webmin public_html, point root there:
    # root /home/mediacbd/public_html;
    root /var/www/mediacbd/react/dist;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /admin/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Prerender writes route/index.html; unknown client routes fall back to the SPA.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /404.html;
}
