# MediaCBD — Nginx
# React `react/dist` is the public site. Django (Gunicorn) only serves /api/ and /admin/.
#
# Install:
#   sudo ln -sf /var/www/mediacbd/deploy/nginx/mediacbd.conf /etc/nginx/sites-available/mediacbd
#   sudo ln -sf /etc/nginx/sites-available/mediacbd /etc/nginx/sites-enabled/mediacbd
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mediacbd.fr -d www.mediacbd.fr
#
# Adjust APP_ROOT if the clone is not /var/www/mediacbd.

upstream mediacbd_django {
    server unix:/run/mediacbd/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name mediacbd.fr www.mediacbd.fr;

    root /var/www/mediacbd/react/dist;
    index index.html;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /admin/ {
        proxy_pass http://mediacbd_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location ^~ /static/ {
        alias /var/www/mediacbd/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Prerender writes route/index.html; unknown client routes fall back to the SPA.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /404.html;
}
