# MediaCBD — Apache reverse proxy (Webmin / Virtualmin)
# PHP cannot proxy to Gunicorn. Paste this into the site's HTTPS VirtualHost
# (Webmin → Services → Apache or Virtualmin → Edit Directives).
# Gunicorn is started by the project user: bash gunicorn-ctl.sh restart
# It listens on 127.0.0.1:8002 only (8001 is taken on this VPS).

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
RequestHeader set X-Forwarded-Proto "http" env=!HTTPS

ProxyPass /api/ http://127.0.0.1:8002/api/
ProxyPassReverse /api/ http://127.0.0.1:8002/api/
ProxyPass /admin/ http://127.0.0.1:8002/admin/
ProxyPassReverse /admin/ http://127.0.0.1:8002/admin/
ProxyPass /static/ http://127.0.0.1:8002/static/
ProxyPassReverse /static/ http://127.0.0.1:8002/static/
ProxyTimeout 120
